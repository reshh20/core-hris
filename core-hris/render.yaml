services:
  - type: web
    name: core-hris-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt psycopg2-binary
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
